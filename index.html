<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ubuntu Desktop Emulator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="desktop">
    <!-- Desktop Icons -->
    <div class="desktop-icons">
      <div class="icon" data-app="terminal">
        <div class="icon-img terminal-icon"></div>
        <span>Terminal</span>
      </div>
      <div class="icon" data-app="files">
        <div class="icon-img files-icon"></div>
        <span>Files</span>
      </div>
      <div class="icon" data-app="browser">
        <div class="icon-img browser-icon"></div>
        <span>Browser</span>
      </div>
      <div class="icon" data-app="settings">
        <div class="icon-img settings-icon"></div>
        <span>Settings</span>
      </div>
    </div>

    <!-- Windows Container -->
    <div id="windows-container"></div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-left">Activities</div>
      <div class="top-center">Ubuntu Emulator</div>
      <div class="top-right">
        <span class="time" id="clock"></span>
        <span class="user-menu">▼</span>
      </div>
    </div>

    <!-- Left Dock -->
    <div class="dock">
      <div class="dock-item" data-app="terminal" title="Terminal">
        <div class="dock-icon terminal-icon"></div>
      </div>
      <div class="dock-item" data-app="files" title="Files">
        <div class="dock-icon files-icon"></div>
      </div>
      <div class="dock-item" data-app="browser" title="Browser">
        <div class="dock-icon browser-icon"></div>
      </div>
      <div class="dock-item" data-app="settings" title="Settings">
        <div class="dock-icon settings-icon"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
